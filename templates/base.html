<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mini Cafe — Modern cafe management system" />
  <title>{% block title %}Mini Cafe{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  {% block head %}{% endblock %}
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────────── -->
<nav class="navbar" id="main-navbar">
  <a href="/" class="nav-brand"><span>☕</span> Mini Cafe</a>

  <div class="nav-links" id="nav-links">
    <!-- injected by app.js based on role -->
  </div>

  <div class="nav-right">
    <div class="nav-badge" id="notif-bell" title="New orders" style="display:none">
      🔔
      <span class="badge-count" id="notif-count" style="display:none">0</span>
    </div>
    <div id="nav-user" style="font-size:0.8rem;color:var(--text-2);display:none">
      <!-- role pill + logout injected -->
    </div>
  </div>
</nav>

<!-- ── Toast container ────────────────────────────────────── -->
<div class="toast-container" id="toast-container"></div>

<!-- ── Main content ──────────────────────────────────────── -->
<main class="page-wrapper">
  {% block content %}{% endblock %}
</main>

<!-- ── Scripts ───────────────────────────────────────────── -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/socket.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
